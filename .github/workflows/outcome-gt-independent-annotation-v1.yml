name: Outcome GT Independent Annotation v1

on:
  push:
    branches:
      - feature/outcome-gt-adjudication-v1
    paths:
      - .github/workflows/outcome-gt-independent-annotation-v1.yml
      - scripts/outcome_gt/outcome_gt_annotation_common_v1.py
      - scripts/outcome_gt/materialize_outcome_gt_independent_passes_v1.py
      - scripts/outcome_gt/validate_outcome_gt_annotation_pass_v1.py
      - scripts/outcome_gt/build_outcome_gt_disagreement_queue_v1.py
      - schemas/outcome_gt_annotation_assignment_v1.schema.json
      - schemas/outcome_gt_independent_decision_v1.schema.json
      - schemas/outcome_gt_disagreement_v1.schema.json
      - schemas/outcome_gt_annotation_v1.schema.json
      - tests/outcome_gt/test_outcome_gt_independent_annotation_pipeline_v1.py
      - docs/outcome_gt/OUTCOME_GT_INDEPENDENT_ADJUDICATION_PROTOCOL_v1.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-annotation-static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Run independent annotation regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest
          tests/outcome_gt/test_outcome_gt_independent_annotation_pipeline_v1.py
          tests/outcome_gt/test_outcome_gt_schemas_v1.py
          -q -p no:cacheprovider

      - name: Validate new JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          for name in (
              "outcome_gt_annotation_assignment_v1.schema.json",
              "outcome_gt_independent_decision_v1.schema.json",
              "outcome_gt_disagreement_v1.schema.json",
              "outcome_gt_annotation_v1.schema.json",
          ):
              schema = json.loads((Path("schemas") / name).read_text(encoding="utf-8"))
              jsonschema.Draft202012Validator.check_schema(schema)
              print("valid schema:", name)
          PY

      - name: Confirm response-bearing pass artifacts remain external
        run: |
          test ! -f data/outcome_gt/adjudication_v1/input/outcome_gt_adjudication_input_1746_v1.jsonl
          test ! -d data/outcome_gt/adjudication_v1/passes/pass_a
          test ! -d data/outcome_gt/adjudication_v1/passes/pass_b
          echo "Independent reviewer artifacts are intentionally local-only."
