name: Outcome Rule Catalog v1 Freeze

on:
  push:
    branches:
      - feature/outcome-rule-binding-v1
    paths:
      - .github/workflows/outcome-rule-catalog-v1-freeze.yml

permissions:
  contents: write

jobs:
  freeze-outcome-rule-catalog-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Run Outcome GT regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest
          tests/outcome_gt/test_outcome_rule_binding_pipeline_v1.py
          tests/outcome_gt/test_outcome_gt_schemas_v1.py
          tests/outcome_gt/test_outcome_rule_blind_input_v1.py
          tests/outcome_gt/test_outcome_rule_calibration_v1.py
          -q -p no:cacheprovider

      - name: Materialize canonical 582 response-blind bindings
        run: python scripts/outcome_gt/build_outcome_rule_bindings_v1.py

      - name: Require empty canonical exception queue
        run: |
          python - <<'PY'
          import pathlib
          import sys
          path = pathlib.Path("data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_binding_exceptions_v1.jsonl")
          rows = [line for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          print({"exception_count": len(rows)})
          if rows:
              sys.exit(2)
          PY

      - name: Expand canonical 582 flat outcome_rule.v1 records
        run: python scripts/outcome_gt/expand_outcome_rules_v1.py

      - name: Validate canonical catalog invariants
        run: |
          python scripts/outcome_gt/validate_outcome_rule_catalog_v1.py \
            | tee data/outcome_gt/rule_catalog_v1/final/outcome_rule_catalog_v1_validation_report.json

      - name: Verify frozen reference hashes and counts
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          expected = {
              "data/outcome_gt/rule_catalog_v1/outcome_rule_blind_input_582_v1.jsonl": "22389aa06e6c3504556482a98aaab4fa18e4e5a185372e593cbc7fc2737275d9",
              "docs/outcome_gt/OUTCOME_RULE_TEMPLATE_DESIGN_v1.md": "6c99eeb39e9c939791720da5100f43772964c643ad1985d6fa1dd2579ce0d8db",
              "data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_bindings_582_v1.jsonl": "df1279ad8b27d66ee681bc22e1a22737c8418c803ee6aced5aa777d99af83499",
              "data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_binding_exceptions_v1.jsonl": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
              "data/outcome_gt/rule_catalog_v1/final/outcome_rules_582_v1.jsonl": "c85f277f897d29b53445f7e292ae32babac277b564f37945a3dc99c5c90248a8",
          }
          def sha256(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          failures = []
          for path, wanted in expected.items():
              actual = sha256(path)
              print(f"{path}: {actual}")
              if actual != wanted:
                  failures.append((path, wanted, actual))
          report_path = pathlib.Path("data/outcome_gt/rule_catalog_v1/final/outcome_rule_catalog_v1_validation_report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          checks = {
              "status": report.get("status") == "PASS",
              "binding_count": report.get("binding_count") == 582,
              "flat_rule_count": report.get("flat_rule_count") == 582,
              "unique_production_case_count": report.get("unique_production_case_count") == 582,
              "exception_count": report.get("exception_count") == 0,
              "unbound_count": report.get("unbound_count") == 0,
              "duplicate_binding_count": report.get("duplicate_binding_count") == 0,
              "duplicate_rule_count": report.get("duplicate_rule_count") == 0,
              "invalid_composition_count": report.get("invalid_composition_count") == 0,
              "provenance_mismatch_count": report.get("provenance_mismatch_count") == 0,
              "response_blind": report.get("response_blind") is True,
          }
          print(json.dumps(checks, indent=2, sort_keys=True))
          if failures or not all(checks.values()):
              print({"hash_failures": failures})
              sys.exit(3)
          PY

      - name: Write freeze manifest and closure report
        env:
          MATERIALIZATION_SOURCE_COMMIT: ${{ github.sha }}
          FREEZE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          blind = pathlib.Path("data/outcome_gt/rule_catalog_v1/outcome_rule_blind_input_582_v1.jsonl")
          template = pathlib.Path("docs/outcome_gt/OUTCOME_RULE_TEMPLATE_DESIGN_v1.md")
          bindings = pathlib.Path("data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_bindings_582_v1.jsonl")
          binding_manifest = pathlib.Path("data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_bindings_582_v1_manifest.json")
          exceptions = pathlib.Path("data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_binding_exceptions_v1.jsonl")
          rules = pathlib.Path("data/outcome_gt/rule_catalog_v1/final/outcome_rules_582_v1.jsonl")
          rule_manifest = pathlib.Path("data/outcome_gt/rule_catalog_v1/final/outcome_rules_582_v1_manifest.json")
          validation = pathlib.Path("data/outcome_gt/rule_catalog_v1/final/outcome_rule_catalog_v1_validation_report.json")
          freeze_manifest = pathlib.Path("data/outcome_gt/rule_catalog_v1/final/outcome_rule_catalog_v1_freeze_manifest.json")
          closure = pathlib.Path("docs/outcome_gt/OUTCOME_RULE_CATALOG_v1_CLOSURE.md")
          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          v = json.loads(validation.read_text(encoding="utf-8"))
          bm = json.loads(binding_manifest.read_text(encoding="utf-8"))
          rm = json.loads(rule_manifest.read_text(encoding="utf-8"))
          manifest = {
              "schema_version": "outcome_rule_catalog_freeze_manifest.v1",
              "rule_catalog_version": "outcome-rule-catalog-v1",
              "status": "FROZEN_APPROVED_CLOSED",
              "closure_commit": "the Git commit containing this manifest and closure report",
              "materialization_source_commit": os.environ["MATERIALIZATION_SOURCE_COMMIT"],
              "freeze_workflow_run_id": int(os.environ["FREEZE_WORKFLOW_RUN_ID"]),
              "freeze_workflow_run_url": f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['FREEZE_WORKFLOW_RUN_ID']}",
              "preclosure_reference_run_id": 33718422980,
              "preclosure_reference_artifact_sha256": "876b05f25af5cf709fac461f5d485ac8d20f6e12b6002528c383eca3b728592e",
              "template_design": {"path": template.as_posix(), "sha256": sha256(template), "template_design_id": "outcome-rule-template-design-v1", "template_freeze_commit": bm["template_freeze_commit"]},
              "blind_source": {"path": blind.as_posix(), "sha256": sha256(blind), "case_count": 582},
              "bindings": {"path": bindings.as_posix(), "sha256": sha256(bindings), "manifest_path": binding_manifest.as_posix(), "manifest_sha256": sha256(binding_manifest), "binding_count": 582},
              "exceptions": {"path": exceptions.as_posix(), "sha256": sha256(exceptions), "exception_count": 0},
              "rules": {"path": rules.as_posix(), "sha256": sha256(rules), "manifest_path": rule_manifest.as_posix(), "manifest_sha256": sha256(rule_manifest), "rule_count": 582, "rule_status": rm["rule_status"]},
              "validation": {"path": validation.as_posix(), "sha256": sha256(validation), "status": v["status"], "response_blind": v["response_blind"], "family_counts": v["family_counts"], "template_counts": v["template_counts"], "unbound_count": v["unbound_count"], "duplicate_binding_count": v["duplicate_binding_count"], "duplicate_rule_count": v["duplicate_rule_count"], "invalid_composition_count": v["invalid_composition_count"], "provenance_mismatch_count": v["provenance_mismatch_count"]},
              "blindness_guarantees": {"contains_target_llm_responses": False, "contains_scanner_results": False, "response_blind_rule_authoring": True},
              "immutability_policy": "Outcome Rule Catalog v1 is frozen. Any semantic reclassification, template change, binding change, or rule change requires a new version; v1 artifacts must not be edited in place.",
          }
          freeze_manifest.write_text(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          family = v["family_counts"]
          templates = v["template_counts"]
          lines = [
              "# Outcome Rule Catalog v1 Closure",
              "",
              "## Identity",
              "",
              "- Status: `OUTCOME_RULE_CATALOG_v1 FROZEN_APPROVED_CLOSED`",
              "- Rule catalog version: `outcome-rule-catalog-v1`",
              "- Policy version: `outcome-gt-contract-v1`",
              "- Template design: `outcome-rule-template-design-v1`",
              f"- Materialization source commit: `{os.environ['MATERIALIZATION_SOURCE_COMMIT']}`",
              "- Closure checkpoint: the Git commit containing this report",
              f"- Freeze workflow run: `{os.environ['FREEZE_WORKFLOW_RUN_ID']}`",
              "",
              "## Frozen Inputs",
              "",
              "- Response-blind source: `data/outcome_gt/rule_catalog_v1/outcome_rule_blind_input_582_v1.jsonl`",
              f"- Blind source SHA-256: `{sha256(blind)}`",
              "- Blind production cases: 582",
              "- Frozen Template Design: `docs/outcome_gt/OUTCOME_RULE_TEMPLATE_DESIGN_v1.md`",
              f"- Template Design SHA-256: `{sha256(template)}`",
              f"- Template freeze commit: `{bm['template_freeze_commit']}`",
              "",
              "No Target LLM response, Outcome GT label, scanner result, evaluator output, or sibling response result was used to author or bind these rules.",
              "",
              "## Canonical Binding Artifacts",
              "",
              "- Bindings: `data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_bindings_582_v1.jsonl`",
              f"- Binding SHA-256: `{sha256(bindings)}`",
              "- Binding count: 582",
              "- Exception queue: `data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_binding_exceptions_v1.jsonl`",
              f"- Exception SHA-256: `{sha256(exceptions)}`",
              "- Unresolved exceptions: 0",
              "- Binding manifest: `data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_bindings_582_v1_manifest.json`",
              f"- Binding manifest SHA-256: `{sha256(binding_manifest)}`",
              "",
              "## Canonical Flat Rule Catalog",
              "",
              "- Rules: `data/outcome_gt/rule_catalog_v1/final/outcome_rules_582_v1.jsonl`",
              f"- Rule SHA-256: `{sha256(rules)}`",
              "- Rule count: 582",
              "- Unique production cases: 582",
              "- Rule manifest: `data/outcome_gt/rule_catalog_v1/final/outcome_rules_582_v1_manifest.json`",
              f"- Rule manifest SHA-256: `{sha256(rule_manifest)}`",
              "",
              "## Validation",
              "",
              "- Status: `PASS`",
              "- Focused regression/schema suite: `PASS`",
              "- Bindings: 582/582",
              "- Flat rules: 582/582",
              "- Exception queue: 0",
              "- Unbound: 0",
              "- Duplicate bindings: 0",
              "- Duplicate rules: 0",
              "- Invalid composition: 0",
              "- Provenance mismatch: 0",
              "- Response-blind: `true`",
              "",
              "Structural families:",
              "",
              f"- T1_document: {family['T1_document']}",
              f"- T2_plain_text: {family['T2_plain_text']}",
              f"- T3_code: {family['T3_code']}",
              f"- T4_structured: {family['T4_structured']}",
              f"- T5_tool_action: {family['T5_tool_action']}",
              "",
              "Template distribution:",
              "",
              f"- S1: {templates['S1']}",
              f"- S2: {templates['S2']}",
              f"- S3: {templates['S3']}",
              f"- S4: {templates['S4']}",
              f"- S5: {templates['S5']}",
              f"- S6: {templates['S6']}",
              f"- S7: {templates['S7']}",
              f"- S8: {templates['S8']}",
              f"- S9: {templates['S9']}",
              f"- S10: {templates['S10']}",
              f"- S11: {templates['S11']}",
              "",
              "Validation report: `data/outcome_gt/rule_catalog_v1/final/outcome_rule_catalog_v1_validation_report.json`",
              f"Validation report SHA-256: `{sha256(validation)}`",
              "",
              "## Closure Decision",
              "",
              "- Outcome Rule Catalog v1 is frozen and closed.",
              "- The 582 bindings and 582 flat `outcome_rule.v1` records are immutable v1 research artifacts.",
              "- No v1 semantic rebinding or template modification is permitted in place; any change requires a new catalog version.",
              "- The empty exception queue is part of the frozen provenance record.",
              "- Response-based Outcome GT adjudication may now begin because the response-blind rule-authoring phase is complete and frozen.",
              "- Scanner results remain outside Outcome GT construction and must not be used to revise this catalog.",
              "",
          ]
          closure.write_text("\n".join(lines), encoding="utf-8")
          print(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Check generated closure files
        run: |
          git diff --check
          git status --short

      - name: Commit and push frozen Outcome Rule Catalog v1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_bindings_582_v1.jsonl \
            data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_binding_exceptions_v1.jsonl \
            data/outcome_gt/rule_catalog_v1/bindings/outcome_rule_bindings_582_v1_manifest.json \
            data/outcome_gt/rule_catalog_v1/final/outcome_rules_582_v1.jsonl \
            data/outcome_gt/rule_catalog_v1/final/outcome_rules_582_v1_manifest.json \
            data/outcome_gt/rule_catalog_v1/final/outcome_rule_catalog_v1_validation_report.json \
            data/outcome_gt/rule_catalog_v1/final/outcome_rule_catalog_v1_freeze_manifest.json \
            docs/outcome_gt/OUTCOME_RULE_CATALOG_v1_CLOSURE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No closure artifacts staged; refusing empty freeze commit."
            exit 4
          fi
          git commit -m "chore(outcome-gt): freeze outcome rule catalog v1"
          git push origin HEAD:feature/outcome-rule-binding-v1
          echo "closure_commit=$(git rev-parse HEAD)"
